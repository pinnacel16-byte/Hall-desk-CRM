<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hall Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--bg:#f1f4f3;--card:#fff;--ink:#16201f;--mute:#5d6b69;--line:#d6dfdc;--acc:#14645f;--gold:#e0a526;--red:#c62828;--redbg:#fde4e2;--grn:#1b7a3d;--grnbg:#dff3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1716;--card:#18231f;--ink:#e8efed;--mute:#9bb0ab;--line:#2c3d38;--acc:#4fb8ae;--redbg:#4a1f1d;--grnbg:#173a26;--red:#ff8a80;--grn:#6fd48f}}
:root[data-theme="dark"]{--bg:#0f1716;--card:#18231f;--ink:#e8efed;--mute:#9bb0ab;--line:#2c3d38;--acc:#4fb8ae;--redbg:#4a1f1d;--grnbg:#173a26;--red:#ff8a80;--grn:#6fd48f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
header{padding:18px 16px 0;max-width:1100px;margin:auto}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px}h1 span{color:var(--gold)}
h2{margin:0;font-size:20px}h3{margin:0 0 6px;font-size:16px}
.pill{font-size:12px;background:var(--acc);color:#fff;border-radius:99px;padding:2px 10px;margin-left:8px;vertical-align:middle;font-weight:600}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:12px;border-bottom:2px solid var(--line)}
nav button{background:none;border:0;padding:10px 14px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button.on{color:var(--acc);border-color:var(--gold)}
main{max-width:1100px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:12px;color:var(--mute);padding:4px 0}
.day{min-height:96px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;text-align:left;font:inherit;color:inherit;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.day.red{background:var(--redbg);border-color:var(--red)}.day.grn{background:var(--grnbg);border-color:var(--grn)}
.day.now .n{background:var(--gold);color:#222;border-radius:99px;padding:0 6px}
.n{font-weight:700;font-size:13px;align-self:flex-start}
.chip{font-size:11px;background:var(--acc);color:#fff;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{font-size:11px;font-weight:700}.red .prog{color:var(--red)}.grn .prog{color:var(--grn)}
button.b,.b{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.b.alt{background:none;color:var(--acc);border:1px solid var(--acc)}.b.dng{background:none;color:var(--red);border:1px solid var(--red)}.b.sm{padding:4px 10px;font-size:13px}
input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
label{font-size:13px;color:var(--mute);display:block}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}
.wide{grid-column:1/-1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:99px;padding:2px 10px;font-weight:600;background:var(--line)}
.tag.r{background:var(--redbg);color:var(--red)}.tag.g{background:var(--grnbg);color:var(--grn)}.tag.y{background:#fbe9b7;color:#6b4b00}
.mute{color:var(--mute);font-size:13px}pre{white-space:pre-wrap;font:inherit;margin:4px 0}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0}.chk input{width:20px;height:20px}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px;z-index:9}
#modal.on{display:flex}#modal .box{background:var(--bg);border-radius:12px;padding:16px;width:100%;max-width:680px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;display:none;z-index:10}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.note{border-left:3px solid var(--gold);padding:2px 0 2px 8px;margin:6px 0}
.addn{display:flex;gap:6px}.addn input{flex:1}
.dayrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--card)}
.fixed{padding:8px;border:1px dashed var(--line);border-radius:8px;color:var(--mute)}
.dd{display:flex;gap:6px;align-items:center}.dd .ddt{flex:1;min-width:0}
.dd .cal{position:relative;flex:none;width:42px;height:38px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;background:var(--bg);cursor:pointer}
.dd .cal input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer}
.login{max-width:380px;margin:40px auto}.login input{margin-bottom:10px}
#who{float:right;font-size:13px;color:var(--mute);margin-top:8px}#who button{margin-left:8px}
@media(max-width:640px){.day{min-height:64px}.chip{font-size:9px}}
</style></head>
<body>
<header><span id="who"></span><h1>Hall <span>Desk</span><span class="pill" id="role"></span></h1><nav id="nav"></nav></header>
<main id="view"><p class="mute">Loading…</p></main>
<div id="modal"><div class="box" id="mbox"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={ev:[],ct:{},pay:{},leads:[],tasks:[],att:[],team:[]};
const HALLS=['Ground floor – Indoor','Ground floor – Outdoor','1st floor','2nd floor'];
const LS=['New','Contacted','Site visit','Negotiating','Won','Lost'];
const TYPES=['Wedding','Reception','Engagement','Birthday','Anniversary','Corporate','Religious / Pooja','Other'];
const SRC=['Walk-in','Phone call','Instagram','Facebook','Google','Referral','Website','Other'];
// To stay inside Firebase's free daily reads, only recent data is loaded:
// bookings from the start of last month onward (plus any month being viewed),
// and to-dos / attendance for the month being viewed.
let evRecent=[],evPast=[],monthSubs=[];
let db,auth,admin=false,uid='',uname='',tab='cal',cur=new Date(),ready=false,lf='Open',lq='';
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const cutoff=ymd(new Date(new Date().getFullYear(),new Date().getMonth()-1,1));
const dmy=k=>k?k.slice(8,10)+'/'+k.slice(5,7)+'/'+k.slice(0,4):'';
const fd=k=>new Date(k+'T00:00').toLocaleDateString('en-IN',{weekday:'short'})+' '+dmy(k);
const ft=t=>t?new Date(t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'–';
const words=t=>(t.trim().match(/\S+/g)||[]).length;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function modal(h){$('#mbox').innerHTML=h;dateFix($('#mbox'));$('#modal').classList.add('on')}
// Date boxes always show dd/mm/yyyy (the browser's own date box follows its language, often mm/dd/yyyy).
// The real date input stays underneath the 📅 button: it holds the value and opens the picker.
const fire=n=>{n.dispatchEvent(new Event('input',{bubbles:true}));n.dispatchEvent(new Event('change',{bubbles:true}))};
function dateFix(root){
 root.querySelectorAll('input[type=date]:not([data-dd])').forEach(n=>{
  n.dataset.dd=1;
  const w=document.createElement('span'),t=document.createElement('input'),c=document.createElement('span');
  w.className='dd';c.className='cal';c.textContent='📅';c.title='Pick a date';
  t.type='text';t.className='ddt';t.inputMode='numeric';t.placeholder='dd/mm/yyyy';t.maxLength=10;t.value=dmy(n.value);if(n.id)t.id=n.id+'_dd';
  n.before(w);w.append(t,c);c.append(n);
  n.addEventListener('click',()=>{try{n.showPicker()}catch(x){}});
  n.addEventListener('change',()=>{t.value=dmy(n.value)});
  t.addEventListener('input',()=>{
   const d=t.value.replace(/\D/g,'').slice(0,8);
   t.value=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d;
   const iso=d.length==8?d.slice(4)+'-'+d.slice(2,4)+'-'+d.slice(0,2):'';
   if(iso&&ymd(new Date(iso+'T00:00'))==iso){if(n.value!=iso){n.value=iso;fire(n)}}
   else if(!d&&n.value){n.value='';fire(n)}
  });
  t.addEventListener('blur',()=>{if(t.value&&t.value!=dmy(n.value)){toast('Date should be dd/mm/yyyy');t.value=dmy(n.value)}});
 });
}
function closeM(){$('#modal').classList.remove('on');$('#mbox').innerHTML=''}
const myTasks=()=>S.tasks.filter(t=>admin||t.to===uid);
const tally=k=>{let a=0,d=0;myTasks().filter(t=>t.date===k).forEach(t=>t.items.forEach(i=>{a++;if(i.d)d++}));return{a,d}};
const payInfo=id=>{const p=S.pay[id]||{total:0,paid:0};const bal=p.total-p.paid;return{...p,bal,st:p.total&&bal<=0?'Paid':p.paid>0?'Partial':'Unpaid'}};
// money: ₹1,50,000 style, plus a plain-words hint (1.5 lakh)
const num=x=>+String(x??'').replace(/[^\d]/g,'')||0;
const inr=n=>'₹'+num(n).toLocaleString('en-IN');
const amtWords=n=>{n=num(n);const f=(x,u)=>(Math.round(x*100)/100).toLocaleString('en-IN')+' '+u;
 return n>=1e7?f(n/1e7,'crore'):n>=1e5?f(n/1e5,'lakh'):n>=1e3?f(n/1e3,'thousand'):n?n+' rupees':''};
const money=(id,val,extra='')=>`<input id="${id}" type="text" inputmode="numeric" data-money value="${num(val)?num(val).toLocaleString('en-IN'):''}" ${extra}><div class="mute" id="${id}_w">${amtWords(val)}</div>`;
const stTag=s=>`<span class="tag ${s=='Paid'?'g':s=='Partial'?'y':'r'}">${s}</span>`;
const booked=k=>S.ev.filter(x=>x.date==k).length;
// A booking covers one or more days in a row. Each day is its own event (so the calendar and the
// 3-per-day limit work per day); the days share a booking id `g`, and the booking has one contact
// and one payment record stored under that id. Older single-day events have no `g`: their own id.
const gk=x=>x.g||x.id;
const daysOf=g=>S.ev.filter(x=>gk(x)==g).sort((a,b)=>a.date>b.date?1:-1);
const addDay=(k,n)=>{const d=new Date(k+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const span=ds=>ds.length>1?dmy(ds[0].date)+' – '+dmy(ds[ds.length-1].date):fd(ds[0].date);
const bookings=()=>{const m={};S.ev.forEach(x=>(m[gk(x)]=m[gk(x)]||[]).push(x));
 return Object.entries(m).map(([g,ds])=>({g,ds:ds.sort((a,b)=>a.date>b.date?1:-1)}))};
const enqOf=l=>l.enq||(l.at?ymd(new Date(l.at)):'');
const isOpen=l=>!['Won','Lost'].includes(l.status);
const dv=x=>x.tagName=='SELECT'?([...x.options].find(o=>o.defaultSelected)||x.options[0]||{}).value:x.defaultValue;

/* ---------- views ---------- */
function render(){
 if(!ready)return;
 const tabs=admin?[['cal','Calendar'],['tasks','Team to-do'],['att','Attendance'],['leads','Leads'],['pay','Payments']]:[['cal','Calendar'],['tasks','My to-do'],['att','My attendance']];
 $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${tab==k?'on':''}" data-a="tab" data-i="${k}">${l}</button>`).join('');
 $('#role').textContent=admin?'Admin':'Team';
 // keep what someone is typing when a teammate's change re-renders the view
 const keep={},a=document.activeElement,fid=a&&$('#view').contains(a)?a.id:'';
 let sel=null;try{if(fid&&a.selectionStart!=null)sel=[a.selectionStart,a.selectionEnd]}catch(x){}
 $('#view').querySelectorAll('input[id],textarea[id],select[id]').forEach(x=>{if(x.value!==dv(x))keep[x.id]=x.value});
 $('#view').innerHTML={cal:vCal,tasks:vTasks,att:vAtt,leads:vLeads,pay:vPay}[tab]();
 dateFix($('#view'));
 for(const k in keep){const x=document.getElementById(k);if(x)x.value=keep[k]}
 $('#view').querySelectorAll('.dd').forEach(w=>{const t=w.querySelector('.ddt');if(!(t.id in keep))t.value=dmy(w.querySelector('input[type=date]').value)});
 const f=fid&&document.getElementById(fid);if(f){f.focus();try{if(sel)f.setSelectionRange(...sel)}catch(x){}}
}
function vCal(){
 const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 let h=`<div class="bar"><button class="b alt sm" data-a="prev">‹ Prev</button><h2>${cur.toLocaleString('en-IN',{month:'long',year:'numeric'})}</h2><button class="b alt sm" data-a="next">Next ›</button></div><div class="grid">`+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<b class="dow">${d}</b>`).join('');
 for(let i=0;i<first;i++)h+='<i></i>';
 for(let d=1;d<=n;d++){
  const k=ymd(new Date(y,m,d)),ev=S.ev.filter(x=>x.date==k).sort((a,b)=>a.from>b.from?1:-1),t=tally(k);
  const c=t.a?(t.d<t.a?'red':'grn'):'';
  h+=`<button class="day ${c} ${k==today()?'now':''}" data-a="day" data-i="${k}"><span class="n">${d}</span>${ev.map(x=>{const ds=daysOf(gk(x));return `<span class="chip">${e(x.from)} ${e(x.event)}${ds.length>1?` · ${ds.findIndex(d=>d.id==x.id)+1}/${ds.length}`:''}</span>`}).join('')}${t.a?`<span class="prog">${t.d}/${t.a} done</span>`:''}</button>`;
 }
 return h+`</div><p class="mute">Red day = to-dos still pending. Green = all ticked. Up to 3 functions per day.</p>`;
}
function evCard(x){
 const g=gk(x),ds=daysOf(g),ct=S.ct[g]||{},p=payInfo(g),n=ds.findIndex(d=>d.id==x.id)+1;
 return `<div class="card"><div class="row"><h3>${e(x.event)}</h3><span>${ds.length>1?`<span class="tag y">Day ${n} of ${ds.length}</span> `:''}<span class="tag">${e(x.hall)}</span></span></div>
 ${ds.length>1?`<div class="mute">${ds.length}-day booking · ${span(ds)} · ${ds.map(d=>e(d.event)).join(', ')}</div>`:''}
 <div class="mute">${e(x.from)}${x.to?' – '+e(x.to):''} · Host: <b>${e(x.host)}</b> · ${x.guests} guests${x.res?' · '+e(x.res):''}</div>
 ${admin?`<div class="mute">Contact: ${e(ct.phone||'–')} ${e(ct.email||'')} · Payment${ds.length>1?' (all days)':''}: ${stTag(p.st)} ${inr(p.paid)} / ${inr(p.total)}</div>`:''}
 <label>Facility notes</label><pre>${e(x.fac||'–')}</pre>
 ${admin?`<div class="row"><span class="row"><button class="b sm" data-a="editev" data-i="${x.id}">Edit booking</button><button class="b alt sm" data-a="linkev" data-i="${x.id}">Combine with another booking</button></span><button class="b dng sm" data-a="delev" data-i="${x.id}">Delete</button></div>`:''}</div>`;
}
function openDay(k){
 const ev=S.ev.filter(x=>x.date==k).sort((a,b)=>a.from>b.from?1:-1);
 const ts=myTasks().filter(t=>t.date==k);
 modal(`<div class="bar"><h2>${fd(k)}</h2><button class="b alt sm" data-a="close">Close</button></div>
 ${ev.map(evCard).join('')||'<p class="mute">No functions booked.</p>'}
 ${ts.length?`<div class="card"><h3>To-dos this day</h3>${ts.map(t=>`<div class="mute">${e(t.toName||'')}: ${e(t.title)} — ${t.items.filter(i=>i.d).length}/${t.items.length}</div>`).join('')}</div>`:''}
 ${admin&&ev.length<3?`<button class="b" data-a="newev" data-i="${k}">Add function (${ev.length}/3)</button>`:ev.length>=3?'<p class="mute">Day is full (3 functions).</p>':''}`);
}
let BK=null; // the booking open in the form: {g, rows:[{id,date,event,hall,from,to,guests}], orig:[day ids], lead}
async function evForm(k,id,pre={}){
 let g='',base={host:pre.host||'',res:'',fac:''},rows=[{date:k,event:pre.event||'',hall:pre.hall||HALLS[0],from:'',to:'',guests:pre.guests||''}];
 if(id){
  const x=S.ev.find(z=>z.id==id);g=gk(x);let ds=daysOf(g);
  // days of a booking may sit in a month that isn't loaded, so fetch them all
  try{const m={};ds.forEach(d=>m[d.id]=d);(await db.collection('events').where('g','==',g).get()).docs.forEach(d=>m[d.id]={id:d.id,...d.data()});ds=Object.values(m).sort((a,b)=>a.date>b.date?1:-1)}catch(err){}
  base=ds[0];rows=ds.map(d=>({id:d.id,date:d.date,event:d.event,hall:d.hall,from:d.from,to:d.to,guests:d.guests}));
 }
 const c=S.ct[g]||{phone:pre.phone,email:pre.email},p=payInfo(g);if(!id&&pre.total)p.total=pre.total;
 BK={g,rows,orig:rows.filter(r=>r.id).map(r=>r.id),lead:pre.lead||''};
 const i=(f,l,v,t='text')=>`<div><label>${l}</label><input id="f_${f}" type="${t}" value="${e(v??'')}"></div>`;
 modal(`<h2>${id?'Edit':'New'} booking</h2><div class="f">
 ${i('host','Host name',base.host)}${i('res','Residence',base.res)}${i('phone','Contact phone',c.phone)}${i('email','Contact email',c.email)}</div>
 <div id="bkdays">${dayRows()}</div>
 <button class="b alt sm" data-a="addday">+ Add next day</button>
 <div class="f" style="margin-top:12px"><div><label>Total amount ₹ (all days)</label>${money('f_total',p.total)}</div><div><label>Paid so far ₹</label>${money('f_paid',p.paid)}</div>
 <div class="wide"><label>Facility notes · <span id="wc">${words(base.fac||'')}</span> words (room for 500+)</label><textarea id="f_fac" rows="10" maxlength="12000">${e(base.fac)}</textarea></div></div>
 <div class="row"><button class="b" data-a="saveev">Save booking</button><button class="b alt" data-a="close">Cancel</button></div>`);
}
function dayRows(){
 const R=BK.rows,f=(i,k,l,v,t='text')=>`<div><label>${l}</label><input id="d_${k}_${i}" type="${t}" value="${e(v??'')}"></div>`;
 return R.map((r,i)=>`<div class="dayrow"><div class="row"><b>Day ${i+1}${R.length>1?' of '+R.length:''}</b>${i&&i==R.length-1?`<button class="b dng sm" data-a="rmday">Remove this day</button>`:''}</div>
 <div class="f">${i==0?f(0,'date','Date',r.date,'date'):`<div><label>Date</label><div class="fixed" id="d_dlbl_${i}">${fd(r.date)}</div></div>`}
 ${f(i,'event','Function',r.event)}<div><label>Hall</label><select id="d_hall_${i}">${HALLS.map(h=>`<option ${h==r.hall?'selected':''}>${h}</option>`).join('')}</select></div>
 ${f(i,'from','Start time',r.from,'time')}${f(i,'to','End time',r.to,'time')}${f(i,'guests','Guest count',r.guests,'number')}</div></div>`).join('');
}
// copy what's typed in the day boxes back into BK; every day after the first follows on from it
function readRows(){
 const d0=$('#d_date_0')?$('#d_date_0').value:BK.rows[0].date;
 BK.rows.forEach((r,i)=>{r.date=d0?addDay(d0,i):'';['event','from','to','guests'].forEach(k=>{const el=$(`#d_${k}_${i}`);if(el)r[k]=el.value.trim()});const h=$('#d_hall_'+i);if(h)r.hall=h.value});
}
const redrawDays=()=>{$('#bkdays').innerHTML=dayRows();dateFix($('#bkdays'))};
function taskCard(t){
 const d=t.items.filter(i=>i.d).length,mine=!admin&&t.to===uid,all=d==t.items.length;
 return `<div class="card"><div class="row"><h3>${e(t.title)}</h3><span class="tag ${all?'g':'r'}">${d}/${t.items.length} done</span></div>
 <div class="mute">${fd(t.date)}${admin?' · '+e(t.toName):''}</div>
 ${t.items.map((i,n)=>`<label class="chk" style="color:var(--ink)"><input type="checkbox" ${i.d?'checked':''} ${mine?`data-c="tick" data-i="${t.id}" data-n="${n}"`:'disabled'}>${e(i.t)}</label>`).join('')}
 ${admin?`<button class="b dng sm" data-a="deltask" data-i="${t.id}">Delete</button>`:''}</div>`;
}
function vTasks(){
 let h='';
 if(admin)h+=`<div class="card"><h3>Assign a to-do list</h3><div class="f">

function vAtt(){

 }
 // admins see themselves first, then the team, plus anyone else who clocked in this month (e.g. other admins)
 const people=admin?[{id:uid,name:uname+' (you)'},...S.team.filter(p=>p.id!=uid)]:[{id:uid,name:uname}];
 if(admin)rows.forEach(a=>{if(!people.some(p=>p.id==a.uid))people.push({id:a.uid,name:a.name||'Staff'})});

function showLogin(msg){
 $('#nav').innerHTML='';$('#role').textContent='';$('#who').innerHTML='';
 $('#view').innerHTML=`<div class="card login"><h2>Sign in</h2><p class="mute">${e(msg||'Use the email and password your admin gave you.')}</p>
 <label>Email</label><input id="li_email" type="email" autocomplete="username"><label>Password</label><input id="li_pass" type="password" autocomplete="current-password">
 <div class="row"><button class="b" data-a="login">Sign in</button><button class="b alt sm" data-a="forgot">Forgot password?</button></div></div>`;
}
Object.assign(A,{
 login:async()=>{try{await auth.signInWithEmailAndPassword(v('li_email'),$('#li_pass').value)}catch(x){toast(x.code=='auth/too-many-requests'?'Too many tries, wait a minute':'Wrong email or password')}},
 forgot:async()=>{if(!v('li_email'))return toast('Type your email first');try{await auth.sendPasswordResetEmail(v('li_email'))}catch(x){}toast('If that account exists, a reset email is on its way')},
 logout:()=>auth.signOut().then(()=>location.reload())
});
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.id=='li_pass')A.login()});

/* ---------- boot (called by the module script below with auth + db) ---------- */
function boot(a,d){
 auth=a;db=d;
 auth.onAuthStateChanged(async u=>{
  if(!u)return showLogin();
  // staff/<email> lists who may use the app and their role ("admin" or "team")
  let st;try{st=await db.doc('staff/'+u.email.toLowerCase()).get()}catch(x){st=null}
  if(!st||!st.exists){showLogin('This account is not on the staff list yet. Ask the admin to add '+u.email+'.');$('#who').innerHTML='<button class="b alt sm" data-a="logout">Sign out</button>';return}
  const s=st.data();admin=s.role=='admin';uid=u.uid;uname=s.name||u.email.split('@')[0];ready=true;
  $('#who').innerHTML=`${e(uname)}<button class="b alt sm" data-a="logout">Sign out</button>`;
  sub(col('events').where('date','>=',cutoff),x=>{evRecent=x;mergeEv()});
  if(admin){
   sub(col('team'),x=>S.team=x);
   sub(col('leads'),x=>S.leads=x);sub(col('contacts'),x=>{S.ct={};x.forEach(c=>S.ct[c.id]=c)});sub(col('payments'),x=>{S.pay={};x.forEach(c=>S.pay[c.id]=c)});
   addMonthField();
  }else db.doc('team/'+uid).set({name:uname,email:u.email.toLowerCase()}).catch(()=>{});
  subMonth();
  render();
 });
}
const sub=(q,f)=>q.onSnapshot(s=>{f(s.docs.map(x=>({id:x.id,...x.data()})));render()},x=>console.error(x));
const col=p=>db.collection(p);
const mergeEv=()=>{const m={};[...evRecent,...evPast].forEach(x=>m[x.id]=x);S.ev=Object.values(m)};
// (re)load the month on screen: its to-dos, attendance, and bookings if older than the cutoff
function subMonth(){
 monthSubs.forEach(u=>u());monthSubs=[];S.tasks=[];S.att=[];evPast=[];mergeEv();
 const ym=ymd(cur).slice(0,7),nx=ymd(new Date(cur.getFullYear(),cur.getMonth()+1,1));
 // team members only see their own to-dos and attendance
 const tq=admin?col('tasks'):col('tasks').where('to','==',uid),aq=admin?col('attendance'):col('attendance').where('uid','==',uid);
 monthSubs.push(sub(tq.where('ym','==',ym),x=>S.tasks=x),sub(aq.where('ym','==',ym),x=>S.att=x));
 if(ym+'-01'<cutoff)monthSubs.push(sub(col('events').where('date','>=',ym+'-01').where('date','<',nx),x=>{evPast=x;mergeEv()}));
}
// one-time: give older to-dos and attendance records the month field the app now loads by
async function addMonthField(){
 try{if(localStorage.getItem('hd_ym_done'))return}catch(x){}
 try{
  for(const c of ['tasks','attendance']){
   const s=await col(c).get();
   for(const d of s.docs){const x=d.data();if(!x.ym&&x.date)await db.doc(c+'/'+d.id).update({ym:x.date.slice(0,7)})}
  }
  try{localStorage.setItem('hd_ym_done','1')}catch(x){}
  subMonth();
 }catch(x){console.error(x)}
}
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,sendPasswordResetEmail,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,addDoc,onSnapshot,query,where} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const C=window.FIREBASE_CONFIG;
if(!C||!C.apiKey||C.apiKey.startsWith('PASTE'))document.getElementById('view').innerHTML='<p>Setup not finished: add your Firebase settings to <b>config.js</b> (see README).</p>';
else{
 const app=initializeApp(C),a=getAuth(app),fs=getFirestore(app,window.FIRESTORE_DATABASE||'(default)');
 if(window.USE_EMULATORS)await window.USE_EMULATORS(a,fs); // local testing only
 // small wrapper so the app code can keep its db.collection(...).doc(...) style
 const D=r=>({id:r.id,set:x=>setDoc(r,x),update:x=>updateDoc(r,x),delete:()=>deleteDoc(r),get:async()=>{const s=await getDoc(r);return{exists:s.exists(),data:()=>s.data()}}});
 const Q=q=>({where:(f,o,v)=>Q(query(q,where(f,o,v))),onSnapshot:(next,err)=>onSnapshot(q,next,err),get:()=>getDocs(q)});
 const db={collection:p=>{const c=collection(fs,p);return{...Q(c),doc:id=>D(id?doc(c,id):doc(c)),add:x=>addDoc(c,x).then(D)}},doc:p=>D(doc(fs,p))};
 const auth={onAuthStateChanged:f=>onAuthStateChanged(a,f),signInWithEmailAndPassword:(e,p)=>signInWithEmailAndPassword(a,e,p),sendPasswordResetEmail:e=>sendPasswordResetEmail(a,e),signOut:()=>signOut(a)};
 boot(auth,db);
}
</script></body></html>
