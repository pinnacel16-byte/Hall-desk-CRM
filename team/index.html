<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14645f">
<title>My To-Do · Hall Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="../config.js"></script>
<style>
:root{--bg:#f1f4f3;--card:#fff;--ink:#16201f;--mute:#5d6b69;--line:#d6dfdc;--acc:#14645f;--gold:#e0a526;--red:#c62828;--redbg:#fde4e2;--grn:#1b7a3d;--grnbg:#dff3e6}
@media(prefers-color-scheme:dark){:root{--bg:#0f1716;--card:#18231f;--ink:#e8efed;--mute:#9bb0ab;--line:#2c3d38;--acc:#4fb8ae;--redbg:#4a1f1d;--grnbg:#173a26;--red:#ff8a80;--grn:#6fd48f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 'Bricolage Grotesque',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 16px calc(env(safe-area-inset-bottom,0) + 24px)}
main{max-width:560px;margin:auto}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 0 8px}
h1{margin:0;font-size:28px;font-weight:800}h1 span{color:var(--gold)}
.sub{color:var(--mute);font-size:16px}
.out{background:none;border:0;color:var(--mute);font:inherit;font-size:15px;text-decoration:underline;cursor:pointer;padding:8px 0}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:24px 0 8px}
h2.late{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card.late{border-color:var(--red)}.card.done{border-color:var(--grn)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h3{margin:0;font-size:21px}
.when{color:var(--mute);font-size:15px;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:99px;margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .25s}
.done .bar i{background:var(--grn)}
.count{font-size:15px;color:var(--mute)}.done .count{color:var(--grn);font-weight:700}
.item{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.box{flex:none;width:30px;height:30px;border:2.5px solid var(--acc);border-radius:9px;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800}
.item.on .box{background:var(--grn);border-color:var(--grn)}
.item.on .t{text-decoration:line-through;color:var(--mute)}
.empty{text-align:center;padding:48px 16px;color:var(--mute)}
.empty b{display:block;font-size:56px;margin-bottom:8px}
.login{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:24px}
label{display:block;font-size:15px;color:var(--mute);margin-top:12px}
input{width:100%;font:inherit;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:4px}
.btn{width:100%;margin-top:18px;padding:16px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.link{background:none;border:0;color:var(--acc);font:inherit;font-size:15px;margin-top:12px;cursor:pointer;padding:6px 0}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;font-size:16px;z-index:9}
</style></head>
<body><main>
<header><div><h1>My <span>To-Do</span></h1><div class="sub" id="hi"></div></div><button class="out" id="out" hidden>Sign out</button></header>
<div id="view"><p class="sub">Loading…</p></div>
</main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const nice=k=>{const t=today(),tm=ymd(new Date(Date.now()+864e5)),y=ymd(new Date(Date.now()-864e5));
 return k==t?'Today':k==tm?'Tomorrow':k==y?'Yesterday':new Date(k+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2400)}
let fb,uid,tasks={},subs=[];

function login(msg){
 $('#hi').textContent='';$('#out').hidden=!msg;
 $('#view').innerHTML=`<div class="login"><div class="sub">${e(msg||'Sign in with the email and password your admin gave you.')}</div>
 <label>Email</label><input id="em" type="email" autocomplete="username" inputmode="email">
 <label>Password</label><input id="pw" type="password" autocomplete="current-password">
 <button class="btn" id="go">Sign in</button><button class="link" id="fp">Forgot password?</button></div>`;
 const go=async()=>{try{await fb.signIn($('#em').value.trim(),$('#pw').value)}catch(x){toast('Wrong email or password')}};
 $('#go').onclick=go;$('#pw').onkeydown=ev=>{if(ev.key=='Enter')go()};
 $('#fp').onclick=async()=>{const m=$('#em').value.trim();if(!m)return toast('Type your email first');try{await fb.reset(m)}catch(x){}toast('Check your email for a reset link')};
}

function card(t){
 const n=t.items.filter(i=>i.d).length,all=t.items.length&&n==t.items.length,late=!all&&t.date<today();
 return `<div class="card ${all?'done':late?'late':''}"><div class="top"><h3>${e(t.title)}</h3><span class="when">${nice(t.date)}</span></div>
 <div class="bar"><i style="width:${t.items.length?n/t.items.length*100:0}%"></i></div>
 <div class="count">${all?'All done ✓':n+' of '+t.items.length+' done'}</div>
 ${t.items.map((i,k)=>`<button class="item ${i.d?'on':''}" data-t="${t.id}" data-k="${k}" aria-pressed="${!!i.d}"><span class="box">${i.d?'✓':''}</span><span class="t">${e(i.t)}</span></button>`).join('')}</div>`;
}
function render(){
 const t=today(),ls=Object.values(tasks).sort((a,b)=>a.date>b.date?1:-1);
 const open=x=>x.items.some(i=>!i.d);
 const late=ls.filter(x=>x.date<t&&open(x)),now=ls.filter(x=>x.date==t),soon=ls.filter(x=>x.date>t);
 const sec=(h,xs,c='')=>xs.length?`<h2 class="${c}">${h}</h2>`+xs.map(card).join(''):'';
 const left=[...late,...now].reduce((s,x)=>s+x.items.filter(i=>!i.d).length,0);
 $('#hi').textContent=`Hi ${fb.name} · ${left?left+' thing'+(left>1?'s':'')+' to do':'nothing pending'}`;
 $('#view').innerHTML=sec('Not finished yet',late,'late')+(now.length?sec('Today',now):`<div class="empty"><b>${late.length?'👆':'🎉'}</b>${late.length?'Nothing new for today.':'No to-dos for today.'}</div>`)+sec('Coming up',soon);
}
document.addEventListener('click',async ev=>{
 const b=ev.target.closest('.item');if(!b)return;
 const t=tasks[b.dataset.t];if(!t)return;
 const items=t.items.map((i,k)=>k==+b.dataset.k?{...i,d:!i.d}:i);
 const was=t.items;t.items=items;render();
 if(items.every(i=>i.d))toast('🎉 '+t.title+' done!');
 try{await fb.tick(t.id,items)}catch(x){t.items=was;render();toast('Could not save, check your internet')}
});
$('#out').onclick=()=>fb.signOut().then(()=>location.reload());

// called by the module script below
async function start(api){
 fb=api;
 fb.onAuth(async u=>{
  subs.forEach(f=>f());subs=[];tasks={};
  if(!u)return login();
  const s=await fb.staff(u.email.toLowerCase()).catch(()=>null);
  if(!s)return login('This account is not on the staff list yet. Ask your admin to add '+u.email+'.');
  uid=u.uid;fb.name=s.name||u.email.split('@')[0];$('#out').hidden=false;
  fb.joinTeam(uid,{name:fb.name,email:u.email.toLowerCase()});
  // last month, this month and next month: enough for overdue, today and coming up
  const d=new Date(),months=[-1,0,1].map(m=>ymd(new Date(d.getFullYear(),d.getMonth()+m,1)).slice(0,7));
  const parts={};
  months.forEach(ym=>subs.push(fb.myTasks(uid,ym,list=>{parts[ym]=list;tasks={};Object.values(parts).flat().forEach(x=>tasks[x.id]=x);render()})));
  render();
 });
}
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,sendPasswordResetEmail,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,setDoc,updateDoc,onSnapshot,query,where} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const C=window.FIREBASE_CONFIG;
if(!C||!C.apiKey||C.apiKey.startsWith('PASTE'))document.getElementById('view').innerHTML='<p class="sub">Setup not finished: Firebase settings missing in config.js.</p>';
else{
 const app=initializeApp(C),a=getAuth(app),fs=getFirestore(app,window.FIRESTORE_DATABASE||'(default)');
 if(window.USE_EMULATORS)await window.USE_EMULATORS(a,fs); // local testing only
 start({
  onAuth:f=>onAuthStateChanged(a,f),
  signIn:(m,p)=>signInWithEmailAndPassword(a,m,p),
  reset:m=>sendPasswordResetEmail(a,m),
  signOut:()=>signOut(a),
  staff:async m=>{const s=await getDoc(doc(fs,'staff',m));return s.exists()?s.data():null},
  joinTeam:(id,d)=>setDoc(doc(fs,'team',id),d).catch(()=>{}),
  myTasks:(id,ym,f)=>onSnapshot(query(collection(fs,'tasks'),where('to','==',id),where('ym','==',ym)),s=>f(s.docs.map(x=>({id:x.id,...x.data()}))),x=>console.error(x)),
  tick:(id,items)=>updateDoc(doc(fs,'tasks',id),{items})
 });
}
</script></body></html>
